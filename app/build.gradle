plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flickmix.firetv'
    compileSdk 34

    defaultConfig {
        applicationId "com.flickmix.firetv"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unsigned release builds are fine for sideloading via `adb install`
            // only if you sign them. For testing, use the debug APK.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Playback stack: hardware decoding, adaptive bitrate, real track selection.
    def media3 = "1.3.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-common:$media3"

    // Artwork: lazy load, downsample, evict off-screen bitmaps.
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
