name: Build FlickMix APK

# This is the part that solves your actual problem.
#
# You do not need a computer, Android Studio, or the Android SDK. Push this
# repository to GitHub and this workflow compiles FlickMix_FireTV.apk on
# GitHub's servers for free. You download the finished APK from the browser
# on your Samsung phone and sideload it to the Fire Stick.

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:        # lets you press "Run workflow" by hand

# Needed so the build can commit the finished APK back into the repository.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename to FlickMix_FireTV.apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/FlickMix_FireTV.apk
          ls -lh out/

      # Prove the APK is complete before publishing it: compiled code, binary
      # manifest, resource table, brand banner and launcher icon all present.
      - name: Verify APK contents
        run: |
          unzip -l out/FlickMix_FireTV.apk
          for needle in classes.dex AndroidManifest.xml resources.arsc banner ic_launcher; do
            unzip -l out/FlickMix_FireTV.apk | grep -q "$needle" \
              || { echo "MISSING FROM APK: $needle"; exit 1; }
          done
          echo "APK verification passed: all required entries present"
          sha256sum out/FlickMix_FireTV.apk

      # The APK appears under the workflow run's "Artifacts" section.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: FlickMix_FireTV
          path: out/FlickMix_FireTV.apk
          retention-days: 30

      # Also commit the verified APK into the repository itself. The
      # Artifacts link above needs a GitHub login and expires; a file in the
      # repo can be fetched over plain git or the raw file URL from any
      # device, including the Downloader app on the Fire Stick.
      # (Pushes made with GITHUB_TOKEN never retrigger workflows, and
      # [skip ci] is added as a second guard, so this cannot loop.)
      - name: Publish APK into the repository
        run: |
          mkdir -p release
          cp out/FlickMix_FireTV.apk release/FlickMix_FireTV.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/FlickMix_FireTV.apk
          git commit -m "Publish built FlickMix_FireTV.apk [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
