name: Build FlickMix APK

# This is the part that solves your actual problem.
#
# You do not need a computer, Android Studio, or the Android SDK. Push this
# repository to GitHub and this workflow compiles FlickMix_FireTV.apk on
# GitHub's servers for free. You download the finished APK from the browser
# on your Samsung phone and sideload it to the Fire Stick.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename to FlickMix_FireTV.apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/FlickMix_FireTV.apk
          ls -lh out/

      # The APK appears under the workflow run's "Artifacts" section.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: FlickMix_FireTV
          path: out/FlickMix_FireTV.apk
          retention-days: 30
